name: SP-API teste de conexao

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  teste:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Obter access token (LWA) e chamar a SP-API
        env:
          SPAPI_CLIENT_ID: ${{ secrets.SPAPI_CLIENT_ID }}
          SPAPI_CLIENT_SECRET: ${{ secrets.SPAPI_CLIENT_SECRET }}
          SPAPI_REFRESH_TOKEN: ${{ secrets.SPAPI_REFRESH_TOKEN }}
          SPAPI_ENDPOINT: ${{ vars.SPAPI_ENDPOINT || 'https://sellingpartnerapi-na.amazon.com' }}
        run: |
          set -euo pipefail

          RESP=$(curl -sS -X POST https://api.amazon.com/auth/o2/token \
            -d grant_type=refresh_token \
            --data-urlencode "refresh_token=$SPAPI_REFRESH_TOKEN" \
            --data-urlencode "client_id=$SPAPI_CLIENT_ID" \
            --data-urlencode "client_secret=$SPAPI_CLIENT_SECRET")

          TOKEN=$(echo "$RESP" | jq -r '.access_token // empty')
          if [ -z "$TOKEN" ]; then
            echo "Falha ao obter token LWA: $(echo "$RESP" | jq -r '.error // "desconhecido"')"
            exit 1
          fi
          echo "::add-mask::$TOKEN"

          mkdir -p data
          curl -sS -f "$SPAPI_ENDPOINT/sellers/v1/marketplaceParticipations" \
            -H "x-amz-access-token: $TOKEN" \
            -H "Content-Type: application/json" \
            | jq . > data/marketplace_participations.json

          echo "Conexao OK"

      - name: Salvar resultado no repositorio
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/
          git commit -m "SP-API: teste de conexao" || echo "Sem mudancas"
          git push
